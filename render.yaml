# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
# A persistent disk keeps the SQLite database and backups across deploys (needs a paid instance).
services:
  - type: web
    name: kanti
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: kanti-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL          # e.g. https://kanti.onrender.com — used in email links
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
