<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanti — Ayurvedic skincare that fits your nature</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2320453B'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' text-anchor='middle' fill='%23C9972F'%3Ek%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --paper:#FAF8F3;
  --surface:#FFFFFF;
  --surface-2:#F1EEE5;
  --ink:#1C241F;
  --muted:#6B746C;
  --line:#E3DFD3;

  --green:#20453B;       /* neem / brand */
  --green-2:#3C6E5E;
  --green-soft:#E7EFE9;
  --gold:#B8862B;        /* turmeric accent */
  --gold-soft:#F4E9CF;

  --vata:#6E74AE;        /* dosha coding */
  --pitta:#C2663A;
  --kapha:#4C7A4E;

  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(28,36,31,.05), 0 8px 24px rgba(28,36,31,.06);
  --maxw:1120px;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --paper:#11150F; --surface:#181D16; --surface-2:#1F261D;
    --ink:#ECEFE8; --muted:#9BA698; --line:#2C342A;
    --green:#6FB49E; --green-2:#8CCBB4; --green-soft:#1E2A22;
    --gold:#D9B255; --gold-soft:#2A2516;
    --vata:#9AA0DC; --pitta:#E0906A; --kapha:#79AE7B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#11150F; --surface:#181D16; --surface-2:#1F261D;
  --ink:#ECEFE8; --muted:#9BA698; --line:#2C342A;
  --green:#6FB49E; --green-2:#8CCBB4; --green-soft:#1E2A22;
  --gold:#D9B255; --gold-soft:#2A2516;
  --vata:#9AA0DC; --pitta:#E0906A; --kapha:#79AE7B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
img{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:500;line-height:1.08;margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.hidden{display:none !important}

/* ---------- Header ---------- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);
  border-bottom:1px solid var(--line);
}
.nav{display:flex;align-items:center;gap:28px;height:64px}
.brand{font-family:var(--font-display);font-size:25px;font-weight:600;letter-spacing:-.01em;cursor:pointer;color:var(--ink)}
.brand span{color:var(--gold)}
.nav-links{display:flex;gap:22px;margin-left:8px}
.nav-links button{color:var(--muted);font-size:15px;font-weight:500;padding:6px 0;border-bottom:2px solid transparent;transition:color .15s}
.nav-links button:hover{color:var(--ink)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.cart-btn{position:relative;display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--surface-2)}
.cart-count{min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);color:#1C241F;font-size:12px;font-weight:700;display:grid;place-items:center}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);font-size:16px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;border-radius:999px;padding:13px 24px;transition:transform .12s,background .15s,opacity .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green);color:#FAF8F3}
.btn-primary:hover{background:var(--green-2)}
.btn-gold{background:var(--gold);color:#201A08}
.btn-gold:hover{opacity:.9}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.btn-sm{padding:9px 16px;font-size:14px}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Hero ---------- */
.hero{background:var(--green);color:#F4F1E8;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-top:76px;padding-bottom:76px}
.hero-eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#C9D8CE;margin-bottom:20px;opacity:0;animation:rise .7s .05s forwards}
.hero h1{font-size:clamp(40px,6vw,66px);font-weight:400;letter-spacing:-.02em;color:#FBF8EF}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{font-size:19px;line-height:1.5;color:#D6E0D7;max-width:46ch;margin:22px 0 32px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero h1,.hero p,.hero-cta{opacity:0;animation:rise .7s forwards}
.hero h1{animation-delay:.12s}.hero p{animation-delay:.22s}.hero-cta{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
/* hero visual: three dosha orbs */
.doshas{display:flex;flex-direction:column;gap:14px;opacity:0;animation:rise .8s .4s forwards}
.dosha-card{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:16px 18px;backdrop-filter:blur(2px)}
.dosha-dot{display:inline-block;width:40px;height:40px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.dosha-card b{font-family:var(--font-display);font-size:19px;font-weight:500;display:block}
.dosha-card small{color:#C2D0C6;font-size:13.5px}

/* ---------- Generic section ---------- */
.section{padding:72px 0}
.section-head{max-width:620px;margin-bottom:42px}
.section-head .eyebrow{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.06em;margin-bottom:12px}
.section-head h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.015em}
.section-head p{color:var(--muted);font-size:17px;margin-top:14px}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.step .num{font-family:var(--font-display);font-size:30px;color:var(--gold);line-height:1}
.step h3{font-size:21px;margin:14px 0 8px}
.step p{color:var(--muted);font-size:15px;margin:0}

/* trust strip */
.trust-strip{background:var(--green-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust-strip .wrap{display:flex;flex-wrap:wrap;gap:14px 34px;padding:26px 24px;justify-content:center}
.trust-item{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;color:var(--green-2)}
.trust-item i{font-style:normal}

/* ---------- Quiz ---------- */
.quiz{max-width:680px;margin:0 auto;padding:56px 24px 90px}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:10px}
.progress>div{height:100%;background:var(--gold);width:0;transition:width .3s}
.progress-label{font-size:13.5px;color:var(--muted);margin-bottom:34px;display:flex;justify-content:space-between}
.q-title{font-size:clamp(25px,4vw,34px);letter-spacing:-.015em;margin-bottom:8px}
.q-sub{color:var(--muted);margin-bottom:28px}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:flex;align-items:flex-start;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px 20px;transition:border-color .15s,background .15s}
.option:hover{border-color:var(--green-2)}
.option.selected{border-color:var(--green);background:var(--green-soft)}
.option .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;transition:.15s}
.option.selected .mark{border-color:var(--green);background:var(--green)}
.option.selected .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.option b{font-weight:600;font-size:16.5px;display:block}
.option small{color:var(--muted);font-size:14px}
.quiz-nav{display:flex;justify-content:space-between;margin-top:30px}

/* ---------- Results reveal animation ---------- */
@keyframes revealUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.animate .rv{opacity:0;animation:revealUp .55s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){.animate .rv{opacity:1;animation:none}}

/* ---------- Dosha flip cards (homepage) ---------- */
.dflip{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;height:82px;perspective:900px}
.dflip:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:var(--radius)}
.dflip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d}
.dflip.flipped .dflip-inner{transform:rotateX(180deg)}
.dface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;gap:15px;padding:14px 18px;border-radius:var(--radius);background:rgba(8,22,17,.55);border:1px solid rgba(255,255,255,.22)}
.dback{transform:rotateX(180deg);background:rgba(8,22,17,.72)}
.dface .dtext{display:flex;flex-direction:column;min-width:0}
.dface b{font-family:var(--font-display);font-size:18px;font-weight:600;color:#FFFFFF}
.dface small{color:#EAF0EB;font-size:13px;line-height:1.35}
.dhint{margin-left:auto;flex:none;font-size:11px;font-weight:700;color:#CBD9CE;display:flex;align-items:center;gap:4px}
.dflip.flipped .dhint{color:var(--gold)}

/* ---------- Ingredient tooltips ---------- */
.has-tip{cursor:help;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:2px}
.has-tip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ingtip{position:fixed;z-index:200;display:none;background:#1C241F;color:#EDEFE9;padding:12px 14px;border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.32);font-size:13px;line-height:1.42}
.ingtip b{display:block;font-size:14px;color:#FBF8EF;margin-bottom:3px}
.ingtip span{display:block;color:#CDD4CC}
.ingtip em{display:block;margin-top:7px;font-style:normal;font-size:12px;font-weight:600;color:#E0B964}

/* ---------- Routine checklist + streak ---------- */
.streak{display:flex;align-items:center;gap:14px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;flex-wrap:wrap}
.streak-flame{font-size:26px;line-height:1;flex:none}
.streak b{font-family:var(--font-display);font-size:19px;color:var(--ink);display:block;line-height:1.1}
.streak small{color:var(--muted);font-size:13px}
.streak-prog{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.streak-prog span{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.streak-prog span.c{color:var(--green-2);border-color:var(--green-2);background:var(--green-soft)}
.routine-hint{font-size:13.5px;color:var(--muted);margin:-8px 0 16px}
.step-no.toggle{padding:0;font:inherit;font-weight:700;border:1.5px solid var(--green-soft);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.step-no.toggle:hover{border-color:var(--green-2);color:var(--green)}
.step-no.toggle.on{background:var(--green);border-color:var(--green);color:#fff}
.routine-step.done{opacity:.66}
.routine-step.done .rs-body b{text-decoration:line-through;text-decoration-color:var(--muted)}

/* ---------- Fun fact ---------- */
.funfact{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--radius);padding:20px 24px;margin-bottom:30px}
.ff-badge{font-weight:700;color:var(--gold);font-size:13px;letter-spacing:.03em;margin-bottom:6px}
.funfact p{margin:0;font-size:16px;line-height:1.5;color:var(--ink)}
.funfact b{color:var(--green-2)}

/* ---------- Results ---------- */
.results{padding:48px 0 80px}
.profile-card{background:var(--green);color:#F4F1E8;border-radius:20px;padding:36px;margin-bottom:40px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.profile-card .eyebrow{color:#C9D8CE;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin-bottom:12px}
.profile-card h2{font-size:clamp(28px,4.5vw,42px);color:#FBF8EF;font-weight:400}
.profile-card h2 em{font-style:italic;color:var(--gold)}
.profile-card p{color:#D4DED5;margin:14px 0 0;max-width:52ch}
.dosha-badge{text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px 26px}
.dosha-badge .big{width:64px;height:64px;border-radius:50%;margin:0 auto 12px}
.dosha-badge b{font-family:var(--font-display);font-size:22px;display:block}
.dosha-badge small{color:#C2D0C6;font-size:13px}

.guidance{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:46px}
.guide-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.guide-card h3{font-size:19px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--green-soft);color:var(--green-2)}
.chip.warn{background:var(--gold-soft);color:var(--gold)}

.routine-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:12px 0 22px}
.routine-head h2{font-size:28px}
.tod{display:flex;gap:8px}
.tod button{font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tod button.active{background:var(--ink);color:var(--paper)}
.routine-step{display:flex;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);align-items:center}
.routine-step .step-no{width:34px;height:34px;border-radius:50%;background:var(--green-soft);color:var(--green-2);font-weight:700;display:grid;place-items:center;flex:none}
.rs-thumb{width:62px;height:62px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:26px}
.rs-body{flex:1;min-width:0}
.rs-body .slot{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);font-weight:700}
.rs-body b{font-size:17px;display:block;margin:2px 0}
.rs-body small{color:var(--muted);font-size:14px}
.rs-price{font-weight:700;margin-right:6px;white-space:nowrap}

/* ---------- Shop ---------- */
.shop{padding:44px 0 80px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.filters .label{width:100%;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.pill{font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1.5px solid transparent;transition:.15s}
.pill:hover{color:var(--ink)}
.pill.active{background:var(--surface);border-color:var(--green);color:var(--green)}
.dosha-filters{margin:16px 0 30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(28,36,31,.12)}
.card-img{height:150px;display:grid;place-items:center;font-size:52px;position:relative}
.card-flag{position:absolute;top:10px;left:10px;font-size:11.5px;font-weight:700;background:var(--surface);color:var(--green-2);padding:4px 9px;border-radius:999px;box-shadow:var(--shadow)}
.card-body{padding:16px 17px 18px;display:flex;flex-direction:column;flex:1}
.card-body .cat{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card-body h3{font-size:18px;margin:5px 0 4px}
.card-body .benefit{font-size:14px;color:var(--muted);flex:1}
.card-ings{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ing-tag{font-size:12px;font-weight:600;color:var(--green-2);background:var(--green-soft);padding:4px 9px;border-radius:7px}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.card-foot .price{font-weight:700;font-size:17px}

/* ---------- Product modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,23,16,.5);z-index:80;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:20px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:translateY(10px);transition:transform .2s}
.overlay.open .modal{transform:none}
.modal-top{display:grid;grid-template-columns:200px 1fr;gap:26px;padding:28px}
.modal-img{height:200px;border-radius:14px;display:grid;place-items:center;font-size:72px}
.modal h2{font-size:27px;margin:6px 0 6px}
.modal .cat{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modal .desc{color:var(--muted);margin:10px 0 16px;font-size:15px}
.modal-meta{border-top:1px solid var(--line);padding:24px 28px}
.meta-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.meta-row:last-child{border-bottom:none}
.meta-row .k{color:var(--muted);font-weight:600}
.safety-flag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green-2);background:var(--green-soft);padding:5px 11px;border-radius:999px;margin:3px 6px 3px 0}
.modal-buy{display:flex;align-items:center;gap:16px;padding:0 28px 28px}
.modal-buy .price{font-size:24px;font-weight:700;font-family:var(--font-display)}
.modal-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}

/* ---------- Cart drawer ---------- */
.drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--surface);z-index:90;box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:22px}
.drawer-body{flex:1;overflow-y:auto;padding:12px 24px}
.cart-line{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.cart-line .thumb{width:54px;height:54px;border-radius:9px;display:grid;place-items:center;font-size:24px;flex:none}
.cart-line .cl-body{flex:1;min-width:0}
.cart-line b{font-size:15px;display:block}
.cart-line small{color:var(--muted);font-size:13px}
.qty{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:999px;margin-top:8px;overflow:hidden}

/* ---------- Routine tracking (checklist + streak) ----------
   Signed out: kept in this browser. Signed in: also saved to the account (GET/PUT /api/routine). */
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return todayStr(d);}
function blankProgress(){return {date:todayStr(),done:{},streak:0,lastComplete:null};}
function freshDay(p){if(p.date!==todayStr()){p.done={};p.date=todayStr();}return p;} // new day → fresh checkboxes, streak kept
function loadProgress(){
  let p=blankProgress();
  try{const s=localStorage.getItem('kanti_routine');if(s){const d=JSON.parse(s);if(d&&typeof d==='object')p=Object.assign(p,d);}}catch(e){}
  return freshDay(p);
}
let routineSaveT=null;
function saveProgress(){
  try{localStorage.setItem('kanti_routine',JSON.stringify(routine));}catch(e){}
  if(API.isAuthed()){clearTimeout(routineSaveT);routineSaveT=setTimeout(()=>API.saveRoutine(routine).catch(()=>{}),600);}
}
// After sign-in: the account's copy wins if it has one, otherwise this browser's progress is uploaded.

let session = {user:null, skin:null, orders:null, history:null, pending:null};
function resetSession(){session={user:null,skin:null,orders:null,history:null,pending:null};}
function loadSession(){
  if(!session.pending){
    session.pending=Promise.all([API.me(),API.orders(),API.quizHistory()])
      .then(([me,o,h])=>{session.user=me.user;session.skin=me.skin;session.orders=o.orders||[];session.history=h.results||[];updateHeader();return session.user;})
      .finally(()=>{session.pending=null;});

}

function requireSignIn(view){

}
// Session expired/revoked → back to sign-in.
function handleAuthError(e,view){
  if(!e||e.status!==401) return false;
  resetSession(); updateHeader();
  toast('Please sign in again');
  state.next=view; go('signin');
  return true;
}
// Render a loading state until the session is loaded; returns true once it's ready.
function ensureSession(view){
  if(session.user && session.orders && session.history) return true; // fully loaded (user + orders + quiz history)
  app.innerHTML=`<div class="checkout"><div class="empty-state"><div class="big">🌿</div><p>Loading your account…</p></div></div>`;
  loadSession().then(()=>{ if(state.view===view) render(); })
    .catch(e=>{

      app.innerHTML=`<div class="checkout"><div class="empty-state"><div class="big">⚠️</div>
        <p>Couldn’t reach the Kanti server — ${esc(e.message)}</p>

function showTip(el){
  const info=lookupIngredient(el.textContent.trim()); if(!info) return;

  if(AUTH_VIEWS.includes(view) && view!=='reset' && API.isAuthed()){ view=state.next||'account'; state.next=null; }

  try{history.replaceState(null,'',view==='home'?location.pathname:'#'+view);}catch(e){} // also drops reset tokens from the URL

// Deep links: /#checkout, /#signin?next=checkout, /#reset=<token> (from the reset email).
function viewFromHash(){
  const raw=(location.hash||'').slice(1);
  const m=raw.match(/^reset=([a-f0-9]{64})$/);
  if(m){state.resetToken=m[1];return 'reset';}
  const [v,q]=raw.split('?');
  const next=new URLSearchParams(q||'').get('next');
  if(next&&/^(checkout|account|quiz|shop)$/.test(next)) state.next=next;
  if(v==='results') return state.profile?'results':'quiz';
  if(v==='reset') return state.resetToken?'reset':'forgot';
  return ['home','quiz','shop','checkout','account','signin','signup','forgot'].includes(v)?v:'home';
}

// (fun fact) and the user's chosen goal; skin, dosha and ingredient guidance come from the API.
function applyClassification(r){
  buildProfile();
  const p=state.profile;
  if(SKIN_LABEL[r.skinType]) p.skin=r.skinType;
  if(DOSHA[r.dosha]) p.dosha=r.dosha;
  const list=a=>Array.isArray(a)&&a.length?a.slice(0,6).map(String):null;
  p.lookFor=list(r.lookFor); p.avoid=list(r.avoid);
  p.rationale=r.rationale?String(r.rationale):'';
  p.source=r.source==='gemini'?'gemini':'rules';
  if(r.saved){ // signed in → the server already saved it to quiz history
    session.skin=r.saved; if(session.history) session.history.unshift(r.saved);
  } else if(!API.isAuthed()) p.unsaved=true; // saved after the user signs in
}

function buildProfile(){
  const skinVotes={},doshaVotes={};let concern=null,culture=null,spice=null;
  state.answers.forEach((a,i)=>{
    if(a.skin)skinVotes[a.skin]=(skinVotes[a.skin]||0)+(i===0?2:1); // Q1 weighted
    if(a.dosha)doshaVotes[a.dosha]=(doshaVotes[a.dosha]||0)+1;
    if(a.doshaHint)doshaVotes[a.doshaHint]=(doshaVotes[a.doshaHint]||0)+0.5; // spice = gentle tiebreaker
    if(a.concern)concern=a.concern;
    if(a.culture)culture=a.culture;
    if(a.spice)spice=a.spice;
  });
  const skin=Object.keys(skinVotes).sort((a,b)=>skinVotes[b]-skinVotes[a])[0]||'normal';
  const dosha=Object.keys(doshaVotes).sort((a,b)=>doshaVotes[b]-doshaVotes[a])[0]||'vata';
  state.profile={skin,dosha,concern,culture,spice};
}

/* match score: dosha + skin + concern */
function scoreProduct(p,prof){
  let s=0;
  if(p.dosha.includes(prof.dosha))s+=3;
  if(p.skin.includes(prof.skin))s+=3;
  if(prof.concern && p.concern && p.concern.includes(prof.concern))s+=2;
  return s;
}
function pickForSlot(slot,prof,todFilter){
  const cands=PRODUCTS.filter(p=>p.slot===slot &&
     (!todFilter || p.tod===todFilter || p.tod==='both'));
  cands.sort((a,b)=>scoreProduct(b,prof)-scoreProduct(a,prof));
  return cands[0];
}
function buildRoutine(prof,tod){
  // ordered slots
  let order = tod==='AM'
    ? ['Cleanse','Tone','Treat','Moisturise','Protect']
    : ['Cleanse','Tone','Treat','Moisturise'];
  const steps=[];
  order.forEach(slot=>{
    const p=pickForSlot(slot, prof, tod);
    if(p){
      const why=[];
      if(p.dosha.includes(prof.dosha))why.push(DOSHA[prof.dosha].name);
      if(p.skin.includes(prof.skin))why.push(SKIN_LABEL[prof.skin].toLowerCase()+' skin');
      p._why = why.length? 'matches your '+why.join(' + ') : 'a universal step';
      steps.push({slot,p});
    }
  });
  return steps;
}

// A labelled input with a slot for its own error message.
function fieldHTML(id,label,value,attrs,optional){
  return `<div class="field" data-f="${id}"><label for="f_${id}">${label}${optional?' <span class="opt">(optional)</span>':''}</label>
    <input id="f_${id}" name="${id}" value="${esc(value||'')}" ${attrs||''}><div class="field-err" id="e_${id}"></div></div>`;
}
function showFieldErrors(errs){
  document.querySelectorAll('.field[data-f]').forEach(f=>{
    const k=f.dataset.f, msg=errs[k]||'';
    f.classList.toggle('has-err',!!msg);
    const e=document.getElementById('e_'+k); if(e) e.textContent=msg;
    const i=document.getElementById('f_'+k); if(i) i.setAttribute('aria-invalid',msg?'true':'false');
  });
  const first=Object.keys(errs)[0]; if(first){const i=document.getElementById('f_'+first); if(i) i.focus();}
}
function formMsg(text,kind){const m=$('#formMsg'); if(!m) return; m.className='form-msg'+(text?' '+(kind||'err'):''); m.textContent=text||'';}
const fval=id=>{const el=document.getElementById('f_'+id);return el?el.value.trim():'';};
async function withBusy(btn,label,fn){
  const old=btn.textContent; btn.disabled=true; btn.textContent=label;
  try{ return await fn(); } finally { if(document.body.contains(btn)){btn.disabled=false;btn.textContent=old;} }
}

async function submitAuth(view){
  const errs={}, email=fval('email'), pw=(document.getElementById('f_password')||{}).value||'';

// Demo card checks only — the numbers are never sent anywhere.
function luhn(d){let s=0,alt=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9;}s+=n;alt=!alt;}return d.length>0&&s%10===0;}
function fmtCard(el){const d=el.value.replace(/\D/g,'').slice(0,19);el.value=d.replace(/(.{4})(?=.)/g,'$1 ');}
function fmtExp(el){const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;}
function validateCheckout(v){
  const e={};
  if(!v.first) e.first='Please add your first name.';
  if(!v.address) e.address='Please add your street address.';
  if(!v.city) e.city='Please add your city.';
  if(!/^[A-Za-z0-9\- ]{3,12}$/.test(v.zip)) e.zip='Please enter a valid ZIP / postcode.';
  if(v.phone && !/^[0-9+()\-.\s]{5,30}$/.test(v.phone)) e.phone='Please enter a valid phone number.';
  const digits=v.card.replace(/\D/g,'');
  if(digits.length<13||!luhn(digits)) e.card='That card number doesn’t look right.';
  const m=v.exp.match(/^(\d{2})\/(\d{2})$/);
  if(!m||+m[1]<1||+m[1]>12) e.exp='Use MM/YY.';
  else if(new Date(2000+ +m[2], +m[1], 1)<=new Date()) e.exp='This card has expired.';
  if(!/^\d{3,4}$/.test(v.cvc)) e.cvc='3 or 4 digits.';
  return e;
}

// Link to the real sent email (Ethereal test inbox in development; none with real SMTP).
function previewLinkHTML(o){
  return o.previewUrl&&/^https:\/\//.test(o.previewUrl)
    ? `<a class="btn btn-ghost btn-sm preview-link" href="${esc(o.previewUrl)}" target="_blank" rel="noopener">Open the sent email ↗</a>`:'';

async function openOrderEmail(no){
  let raw=(session.orders||[]).find(x=>x.order_no===no);
  // The email may have finished sending after the order was placed → refresh to pick up its link.
  if(raw&&!raw.email_preview_url){try{raw=(await API.order(no)).order;}catch(e){}}
  if(!raw) return;
  const o=orderView(raw);
  $('#modal').innerHTML=`<button class="modal-close" onclick="closeModal()">✕</button><div style="padding:26px 24px 28px">${emailPreviewHTML(o)}${previewLinkHTML(o)}</div>`;
  $('#overlay').classList.add('open');
}
// Put a past order's products back in the bag (current prices; retired products are skipped).
function reorder(no){
  const o=(session.orders||[]).find(x=>x.order_no===no); if(!o) return;
  let added=0, missing=0;
  o.items.forEach(it=>{ addToCart(it.id,true,it.qty) ? added++ : missing++; });
  toast(added?`${added} product${added>1?'s':''} added to bag${missing?` · ${missing} no longer available`:''}`:'Those products are no longer available');
  if(added) openCart();
}

async function saveProfileEdits(){
  const v={}; ['name','phone','address','address2','city','state','zip','country'].forEach(k=>v[k]=fval(k));
  const errs={};
  if(!v.name) errs.name='Name can’t be empty.';

  await withBusy($('#saveBtn'),'Saving…',async()=>{
    try{
      const me=await API.updateMe(v);
      session.user=me.user; state.editProfile=false; render(); toast('Profile updated');
    }catch(e){ if(!handleAuthError(e,'account')) formMsg(e.message||'Could not save'); }
  });
}
async function changePassword(){
  const current=(document.getElementById('f_current')||{}).value||'', next=(document.getElementById('f_password')||{}).value||'';
  const errs={};
  if(!current) errs.current='Enter your current password.';
  if(next.length<8) errs.password='Use at least 8 characters.';
  showFieldErrors(errs); if(Object.keys(errs).length) return;
  await withBusy($('#pwBtn'),'Updating…',async()=>{
    try{ await API.changePassword(current,next); state.acctForm=null; render(); toast('Password updated'); }
    catch(e){ if(!handleAuthError(e,'account')) formMsg(e.message); }
  });
}
async function deleteAccount(){
  const pw=(document.getElementById('f_password')||{}).value||'';
  if(!pw){showFieldErrors({password:'Enter your password to confirm.'});return;}
  await withBusy($('#delBtn'),'Deleting…',async()=>{
    try{
      await API.deleteAccount(pw);
      resetSession(); state.profile=null; state.cart=[]; state.acctForm=null; routine=blankProgress();
      try{localStorage.removeItem('kanti_routine');}catch(e){}
      updateCartCount(false); updateHeader(); go('home'); toast('Your account has been deleted');
    }catch(e){ if(!handleAuthError(e,'account')) formMsg(e.message); }
  });
}

/* ---------- Share your result ---------- */
function funFactText(prof){
  const ct=CULTURE_TRAIT[prof.culture]||'your own thing';
  const sn=SPICE_NOTE[prof.spice]||'you keep your kitchen interesting';
  return `Drawn to ${ct}, and ${sn}.`;
}
function resultSummaryText(prof){
  const d=DOSHA[prof.dosha];
  return `My Kanti skin profile: ${SKIN_LABEL[prof.skin]} skin, ${d.name}-leaning. ${funFactText(prof)} Find your Ayurvedic routine 🌿`;
}
function wrapCanvasText(ctx,text,cx,y,maxW,lh){
  const words=text.split(' ');let line='';const lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);
  lines.forEach((ln,i)=>ctx.fillText(ln,cx,y+i*lh));
  return lines.length;
}
function renderShareCanvas(prof){
  const d=DOSHA[prof.dosha], W=1080, H=1080;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#20453B';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(201,151,47,.5)';x.lineWidth=4;x.strokeRect(50,50,W-100,H-100);
  x.textAlign='center';
  x.fillStyle='#E0B964';x.font='700 32px Arial';x.fillText('MY KANTI SKIN PROFILE',W/2,185);
  x.fillStyle='#F7F3E9';x.font='600 104px Georgia';x.fillText(SKIN_LABEL[prof.skin]+' skin',W/2,330);
  x.fillStyle='#E0B964';x.font='600 92px Georgia';x.fillText(d.name+'-leaning',W/2,450);
  const dcol={vata:'#8A90C8',pitta:'#D2764A',kapha:'#5E9160'};const names=['vata','pitta','kapha'];const gap=170,sx=W/2-gap;
  names.forEach((k,i)=>{x.beginPath();x.fillStyle=dcol[k];x.arc(sx+i*gap,560,36,0,Math.PI*2);x.fill();
    x.fillStyle=(k===prof.dosha)?'#F7F3E9':'#7E9389';x.font='500 28px Arial';x.fillText(DOSHA[k].name,sx+i*gap,648);});
  x.fillStyle='#EAE6DA';x.font='400 44px Georgia';
  wrapCanvasText(x,funFactText(prof),W/2,760,W-260,62);
  x.fillStyle='#E0B964';x.font='700 70px Georgia';x.fillText('Kanti',W/2,955);
  x.fillStyle='#AFC0B4';x.font='400 30px Arial';x.fillText('Skincare that fits your nature',W/2,1000);
  return c;
}
function shareResult(){
  const prof=state.profile; if(!prof){toast('Take the quiz first');return;}
  const dataUrl=renderShareCanvas(prof).toDataURL('image/png');
  window._shareData=dataUrl; window._shareText=resultSummaryText(prof);
  $('#modal').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="share-wrap">
      <h2>Share your result</h2>
      <img class="share-img" src="${dataUrl}" alt="My Kanti skin result card">
      <div class="share-actions">
        <button class="btn btn-primary" onclick="downloadShare()">Download image</button>
        <button class="btn btn-ghost" onclick="copyShareText()">Copy text</button>
      </div>
      <p class="share-note">Save the image to post it, or copy the text to share your result.</p>
    </div>`;
  $('#overlay').classList.add('open');
}
function downloadShare(){
  try{const a=document.createElement('a');a.href=window._shareData;a.download='my-kanti-result.png';document.body.appendChild(a);a.click();a.remove();toast('Image downloaded');}
  catch(e){toast('Download not supported here');}
}
function copyShareText(){
  const t=window._shareText||'';
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard')).catch(()=>toast('Press and hold to copy'));}
  else toast('Copy not supported here');
}

function footerHTML(){
  return `<footer><div class="wrap">
    <div class="brand">Kan<span style="color:var(--gold)">ti</span></div>
    <small>Ayurvedic skincare that fits your nature · Prototype for demonstration</small>
  </div></footer>`;
}

/* ---------- Theme toggle ---------- */
function toggleTheme(){
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  const isDark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme:dark)').matches);
  root.setAttribute('data-theme', isDark?'light':'dark');
  $('#themeBtn').textContent = isDark?'☾':'☀';
}

/* ---------- Tooltip interaction (delegated, capture phase) ---------- */
document.addEventListener('click',function(e){
  const chip = e.target.closest && e.target.closest('.has-tip');
  if(chip){ e.stopPropagation(); e.preventDefault(); toggleTip(chip); return; }
  if(!(e.target.closest && e.target.closest('#ingtip'))) hideTip();
}, true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ hideTip(); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('has-tip')){
    e.preventDefault(); toggleTip(e.target);
  }
});
window.addEventListener('scroll',hideTip,true);
window.addEventListener('resize',hideTip);

/* ---------- Boot ---------- */
(async function boot(){
  try{ localStorage.removeItem('kanti_token'); }catch(e){} // tokens are no longer kept in page storage
  updateHeader();
  app.innerHTML=`<div class="checkout"><div class="empty-state"><div class="big">🌿</div><p>Loading…</p></div></div>`;
  try{
    const r=await API.products();
    PRODUCTS=r.products; SHIPPING=r.shipping||SHIPPING;
  }catch(e){
    app.innerHTML=`<div class="checkout"><div class="empty-state"><div class="big">⚠️</div>
      <p>Couldn’t load the shop — is the Kanti server running?</p>
      <button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  restoreState();
  updateCartCount(false);
  if(API.isAuthed()){
    // Signed in from an earlier visit: load the saved bag and routine.
    API.cart().then(r=>{setCartFromServer(r.items);if(state.view==='checkout')render();})
      .catch(e=>{if(e.status===401){resetSession();updateHeader();}});
    syncRoutine();
  }
  go(viewFromHash());
  window.addEventListener('hashchange',()=>{const v=viewFromHash(); if(v!==state.view) go(v);});
})();
</script>
