<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanti — Ayurvedic skincare that fits your nature</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2320453B'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' text-anchor='middle' fill='%23C9972F'%3Ek%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/kanti.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand" data-go="home">Kan<span>ti</span></div>
    <nav class="nav-links">
      <button data-go="home">Home</button>
      <button data-go="quiz">Find your routine</button>
      <button data-go="shop">Shop</button>
      <button data-go="account" id="navAccount">Sign in</button>
      <button data-go="admin" id="navAdmin" class="hidden">Admin</button>
    </nav>
    <div class="nav-right">
      <button class="icon-btn" data-act="toggleTheme" title="Toggle light/dark" id="themeBtn">☾</button>
      <button class="icon-btn" data-go="account" title="My account" aria-label="My account" id="navAcctIcon">👤</button>
      <button class="cart-btn" data-act="openCart">
        <span>Bag</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- Cart drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Your bag</h2>
    <button class="icon-btn" data-act="closeCart">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</div>

<!-- Product modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" style="position:relative"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/api.js" defer></script>
<script src="/js/data.js" defer></script>
<script src="/js/art.js" defer></script>
<script src="/js/state.js" defer></script>
<script src="/js/ui.js" defer></script>
<script src="/js/views.js" defer></script>
<script src="/js/shop.js" defer></script>
<script src="/js/account.js" defer></script>
<script src="/js/share.js" defer></script>
<script src="/js/admin.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
