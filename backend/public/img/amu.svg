<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#20453B"/>
  <!-- tail fan peeking behind -->
  <g opacity=".9">
    <path d="M8 64 C6 46 14 36 26 40 L30 64Z" fill="#2E6B4F"/>
    <circle cx="13" cy="50" r="3.4" fill="#C9972F"/><circle cx="13" cy="50" r="1.6" fill="#1D4E7A"/>
    <circle cx="20" cy="58" r="2.8" fill="#C9972F"/><circle cx="20" cy="58" r="1.3" fill="#1D4E7A"/>
  </g>
  <!-- crest -->
  <g stroke="#E9C266" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M33 21 C31 16 28 13 26 10"/><path d="M35 20 L35 8"/><path d="M37 21 C39 16 42 13 44 10"/>
  </g>
  <g><circle cx="26" cy="9.5" r="2.6" fill="#E9C266"/><circle cx="26" cy="9.5" r="1.2" fill="#1D4E7A"/>
     <circle cx="35" cy="7.5" r="2.8" fill="#E9C266"/><circle cx="35" cy="7.5" r="1.3" fill="#1D4E7A"/>
     <circle cx="44" cy="9.5" r="2.6" fill="#E9C266"/><circle cx="44" cy="9.5" r="1.2" fill="#1D4E7A"/></g>
  <!-- neck -->
  <path d="M27 64 C26 54 27 44 31 38 L41 39 C40 47 41 56 45 64Z" fill="#2A6FA8"/>
  <path d="M33 64 C33 56 34 48 36 42" stroke="#3E86C2" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- head -->
  <ellipse cx="36" cy="30" rx="11.5" ry="11" fill="#2A6FA8"/>
  <!-- white eye stripe -->
  <path d="M30.5 27.5 C33 24.5 39 24.5 42 27.5 C40 31.5 33 31.5 30.5 27.5Z" fill="#F4F1E8"/>
  <circle cx="37" cy="28" r="2.3" fill="#1C241F"/><circle cx="37.8" cy="27.2" r=".8" fill="#fff"/>
  <!-- beak -->
  <path d="M46.5 29 C49 29.5 51 30.5 52.5 31.5 C51 32.5 49 33.2 46.5 33.4Z" fill="#E0A23A"/>
  <!-- blush -->
  <ellipse cx="41.5" cy="35" rx="2.2" ry="1.4" fill="#E89A7A" opacity=".75"/>
</svg>
