# Netlify serves the storefront pages; every /api request is passed through to the Kanti server
# (hosted on Render — see render.yaml). The browser only ever talks to the netlify.app address,
# so sign-in cookies and the security policy work exactly as they do locally.
#
# Set BACKEND_URL in Netlify (Site configuration → Environment variables), e.g.
#   BACKEND_URL = https://kanti.onrender.com      (no trailing slash)
[build]
  publish = "backend/public"
  command = "test -n \"$BACKEND_URL\" || { echo 'Set BACKEND_URL in the Netlify environment variables'; exit 1; }; printf '/api/*  %s/api/:splat  200!\\n' \"${BACKEND_URL%/}\" > backend/public/_redirects"

# Old standalone pages now live inside the storefront (same as the Express server does).
[[redirects]]
  from = "/signin.html"
  to = "/#signin"
  status = 301
[[redirects]]
  from = "/signup.html"
  to = "/#signup"
  status = 301
[[redirects]]
  from = "/account.html"
  to = "/#account"
  status = 301
[[redirects]]
  from = "/quiz.html"
  to = "/#quiz"
  status = 301

# Same security headers the Express server sends.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=15552000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; script-src-attr 'none'; object-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
